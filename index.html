<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<!-- Esto hace que el celular la reconozca como una App para instalarla -->
<link rel="manifest" href='data:application/manifest+json,{"name":"Rastreador Web","short_name":"Rastreador","start_url":".","display":"standalone","background_color":"#0f0f12","theme_color":"#0f0f12","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/854/854878.png","sizes":"512x512","type":"image/png"}]}'>
<title>Rastreador Web</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
:root{--bg:#0f0f12;--card:#1a1a1f;--border:#26262e;--text:#f2f2f2;--muted:#9a9aa5;--ok:#37d67a;--err:#ff5a5a;--p1:#f09433;--p2:#bc1888;--link:#7db3ff}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0}
input{font:inherit;color:inherit}
#boot-error{background:#3a0000;color:#ffb0b0;padding:14px;font-family:ui-monospace,monospace;font-size:.8rem;white-space:pre-wrap;border-bottom:2px solid #ff5a5a;display:none}
#picker{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:520px;width:100%}
.card h1{margin:0 0 6px;font-size:1.45rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.btn{display:flex;flex-direction:column;gap:2px;width:100%;padding:16px;margin-top:12px;border-radius:12px;text-align:left;background:#24242c;color:var(--text);transition:background .2s}
.btn:hover{background:#2c2c36}
.btn strong{font-size:1rem}
.btn span{font-size:.85rem;color:var(--muted);font-weight:400}
.btn.primary{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff}
.btn.primary span{color:rgba(255,255,255,.85)}
.btn.ghost{background:#24242c}
.btn.small-btn{padding:10px 16px;width:auto;flex-direction:row;align-items:center;gap:6px;margin:0}
#phone{min-height:100vh;padding:16px;display:flex;align-items:flex-start;justify-content:center}
.phone-wrap{width:100%;max-width:480px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:transparent;color:var(--text);font-size:1.4rem;padding:4px 10px;border-radius:8px}
.topbar h2{margin:0;font-size:1.1rem}
.code-box{background:#121217;border:1px dashed #3a3a45;border-radius:10px;padding:14px;font-family:ui-monospace,monospace;font-size:.82rem;word-break:break-all;color:var(--link);line-height:1.5;margin-top:8px}
.status{margin:14px 0;padding:12px;border-radius:10px;background:#121217;border:1px solid var(--border);font-size:.9rem}
.status.ok{color:var(--ok);border-color:#1d4a32}
.status.error{color:var(--err);border-color:#4a1d1d}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.info-grid>div{background:#121217;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:.8rem}
.info-grid span{color:var(--muted);display:block;margin-bottom:2px}
.info-grid b{font-family:ui-monospace,monospace;font-weight:500}
.warn{background:#3a1d00;color:#ffcc80;padding:10px;border-radius:8px;font-size:.85rem;margin-top:12px}
#monitor{height:100vh;display:flex;flex-direction:column}
.monitor-header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.monitor-header input{flex:1;min-width:170px;padding:10px 12px;border-radius:8px;border:1px solid #2e2e36;background:#121217;font-family:ui-monospace,monospace;font-size:.85rem}
#m-conn{font-size:.85rem;color:var(--muted);margin-left:auto}
#m-conn.ok{color:var(--ok)}
.monitor-body{flex:1;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
#map{width:100%;height:100%;background:#1a1a1f}
#map .leaflet-tile-container { filter: invert(90%) hue-rotate(180deg) brightness(85%) contrast(110%); }
.monitor-body aside{background:var(--card);border-left:1px solid var(--border);padding:18px;overflow-y:auto;font-size:.9rem}
.monitor-body aside h3{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
.monitor-body aside h3:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:12px}
.row b{font-family:ui-monospace,monospace;font-weight:500}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;cursor:pointer}
#m-gmaps{display:block;text-align:center;padding:10px;margin-top:12px;border-radius:8px;background:#24242c;color:var(--text);text-decoration:none;font-size:.9rem}
@media (max-width:780px){.monitor-body{grid-template-columns:1fr;grid-template-rows:1fr auto}#map{min-height:50vh}.monitor-body aside{max-height:45vh;border-left:0;border-top:1px solid var(--border)}}
</style>
</head>
<body>

<div id="boot-error"></div>
<noscript style="display:block;padding:20px;background:#3a0000;color:#fff">Necesitas JavaScript activado.</noscript>

<section id="picker">
  <div class="card">
    <h1>📡 Rastreador Web</h1>
    <p class="muted small" style="margin:0 0 8px">Instala esta web en tu celular y rastréalo desde tu laptop.</p>
    <button class="btn primary" data-role="phone"><strong>📱 Soy el Celular</strong><span>Compartir mi ubicación</span></button>
    <button class="btn secondary" data-role="monitor"><strong>💻 Soy la Laptop</strong><span>Ver la ubicación</span></button>
  </div>
</section>

<section id="phone" class="hidden">
  <div class="phone-wrap"><div class="card">
    <div class="topbar"><button class="back" data-back>←</button><h2>📱 Celular</h2></div>
    <p class="muted small" style="margin:0">Pasa este código a tu laptop:</p>
    <div class="code-box" id="phone-code">—</div>
    <div id="phone-status" class="status">Detenido</div>
    <button class="btn primary" id="start-share">▶ Iniciar Rastreo</button>
    <button class="btn ghost hidden" id="stop-share">⏹ Detener (Pide Clave)</button>
    <div class="info-grid">
      <div><span>Precisión</span><b id="p-acc">—</b></div>
      <div><span>Envíos</span><b id="p-sent">0</b></div>
    </div>
    <div class="warn" id="warn-https hidden">⚠️ Esta página no está en HTTPS. El GPS no funcionará.</div>
  </div></div>
</section>

<section id="monitor" class="hidden">
  <div class="monitor-header">
    <button class="back" data-back>←</button>
    <input id="m-code" placeholder="Pega el código del celular" autocomplete="off" spellcheck="false">
    <button class="btn primary small-btn" id="m-connect">Conectar</button>
    <span id="m-conn">Desconectado</span>
  </div>
  <div class="monitor-body">
    <div id="map"></div>
    <aside>
      <h3>Última Posición</h3>
      <div class="row"><span>Lat</span><b id="m-lat">—</b></div>
      <div class="row"><span>Lng</span><b id="m-lng">—</b></div>
      <div class="row"><span>Precisión</span><b id="m-acc">—</b></div>
      <div class="row"><span>Actualizado</span><b id="m-ago">—</b></div>
      <a id="m-gmaps" target="_blank" rel="noopener">📍 Abrir en Google Maps</a>
      <label class="chk"><input type="checkbox" id="m-follow" checked> Seguir</label>
    </aside>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.addEventListener('error', e => {
  const el = document.getElementById('boot-error');
  el.textContent = '⚠️ Error: ' + (e.message || e);
  el.style.display = 'block';
});
</script>

<script type="module">
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const showErr = (msg) => { const e = $('#boot-error'); e.textContent = msg; e.style.display = 'block'; };

const ADMIN_PASS = "admin123gutyu@";

const firebaseConfig = {
  apiKey: "AIzaSyDyqHLM20NmklOtpB5bjMpyvGn_E0YCGRM",
  authDomain: "ubicacion-e3ec6.firebaseapp.com",
  databaseURL: "https://ubicacion-e3ec6-default-rtdb.firebaseio.com",
  projectId: "ubicacion-e3ec6",
  storageBucket: "ubicacion-e3ec6.firebasestorage.app",
  messagingSenderId: "837106049471",
  appId: "1:837106049471:web:c91c09f704e10c85d4010a"
};

let db = null, activeRole = null;
let phoneRoomCode, phoneWatch, phoneWakeLock, phoneSendCount=0;
let monitorUnsub, monitorTickTimer, monitorLastTs=0;
let map, marker;

try {
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  const dbf = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
  const app = initializeApp(firebaseConfig);
  db = dbf.getDatabase(app);
  window._dbf = dbf;
} catch (e) {
  showErr('❌ Error en Firebase: ' + e.message); throw e;
}

const genCode = () => {
  const buf = new Uint8Array(20); crypto.getRandomValues(buf);
  return Array.from(buf, b => b.toString(36).padStart(2,'0')).join('').slice(0,28);
};
const showOnly = id => ["picker","phone","monitor"].forEach(x => $("#"+x).classList.toggle("hidden", x!==id));

$$("[data-role]").forEach(b => b.addEventListener("click", () => switchRole(b.dataset.role)));
$$("[data-back]").forEach(b => b.addEventListener("click", () => {
  if (activeRole === "phone" && phoneWatch !== null) {
    const pass = prompt("🔒 Rastreo activo.\nIntroduce la contraseña para salir:");
    if (pass !== ADMIN_PASS) { alert("Contraseña incorrecta."); return; }
  }
  switchRole(null);
}));

// Bloquea el cierre accidental
window.addEventListener('beforeunload', (e) => {
  if (activeRole === "phone" && phoneWatch !== null) {
    e.preventDefault(); e.returnValue = '';
  }
});

function switchRole(role){
  if (activeRole==="phone") stopPhone(true);
  if (activeRole==="monitor") stopMonitor();
  activeRole = role;
  if (!role) { showOnly("picker"); return; }
  showOnly(role);
  role==="phone" ? initPhone() : initMonitor();
}

function initPhone(){
  phoneRoomCode = localStorage.getItem("phoneRoom") || genCode();
  localStorage.setItem("phoneRoom", phoneRoomCode);
  $("#phone-code").textContent = phoneRoomCode;
  $("#phone-status").textContent="Detenido"; $("#phone-status").className="status";
  $("#start-share").classList.remove("hidden"); $("#stop-share").classList.add("hidden");
}

$("#start-share").addEventListener("click", startPhone);
$("#stop-share").addEventListener("click", () => {
  const pass = prompt("🔒 Introduce la contraseña para detener:");
  if (pass === ADMIN_PASS) stopPhone();
  else alert("Contraseña incorrecta. El rastreo continúa.");
});

async function startPhone(){
  if (!("geolocation" in navigator)){ alert("Sin GPS"); return; }
  
  // TRUCO MÁGICO: Evita que la pantalla se apague mientras la web está abierta
  try { if ("wakeLock" in navigator) phoneWakeLock = await navigator.wakeLock.request("screen"); } catch {}

  phoneSendCount=0; $("#p-sent").textContent="0";
  phoneWatch = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
  
  $("#start-share").classList.add("hidden"); $("#stop-share").classList.remove("hidden");
  $("#phone-status").textContent="Rastreando ✅ (Pantalla encendida)"; $("#phone-status").className="status ok";
}

function stopPhone(force = false){
  if (!force && phoneWatch === null) return;
  if (phoneWatch!==null){ navigator.geolocation.clearWatch(phoneWatch); phoneWatch=null; }
  if (phoneWakeLock){ try{phoneWakeLock.release();}catch{} phoneWakeLock=null; }
  if (!$("#phone-status")) return;
  $("#phone-status").textContent="Detenido"; $("#phone-status").className="status";
  $("#start-share").classList.remove("hidden"); $("#stop-share").classList.add("hidden");
}

async function onPos(pos){
  const now = Date.now(), c = pos.coords;
  phoneSendCount++;
  $("#p-sent").textContent = phoneSendCount;
  $("#p-acc").textContent = Math.round(c.accuracy) + " m";
  
  const dbf = window._dbf;
  try {
    await dbf.set(dbf.ref(db, `rooms/${phoneRoomCode}/current`), {
      lat: c.latitude, lng: c.longitude, accuracy: c.accuracy, tsLocal: now
    });
  } catch(e) { console.error(e); }
}

function onErr(err){
  $("#phone-status").textContent="⚠️ GPS: "+err.message; $("#phone-status").className="status error";
}

async function initMonitor(){
  $("#m-code").value = localStorage.getItem("monitorRoom") || "";
  if (!map){
    map = L.map("map").setView([-12.05,-77.05], 13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19}).addTo(map);
  }
  setTimeout(()=>map && map.invalidateSize(), 150);
  if ($("#m-code").value.length >= 20) connectMonitor();
}

$("#m-connect").addEventListener("click", connectMonitor);

function connectMonitor(){
  const code = $("#m-code").value.trim();
  if (code.length < 20){ alert("Código inválido"); return; }
  localStorage.setItem("monitorRoom", code);
  stopMonitor();
  
  $("#m-conn").textContent = "Conectando…";
  const dbf = window._dbf;
  
  monitorUnsub = dbf.onValue(dbf.ref(db, `rooms/${code}/current`), snap => {
    const d = snap.val(); if (!d) return;
    updateMonitor(d);
    $("#m-conn").textContent = "🟢 En vivo"; $("#m-conn").className = "ok";
  });
  
  clearInterval(monitorTickTimer);
  monitorTickTimer = setInterval(() => {
    if (!monitorLastTs) return;
    const s = Math.round((Date.now()-monitorLastTs)/1000);
    $("#m-ago").textContent = s<60 ? `hace ${s}s` : `hace ${Math.floor(s/60)} min`;
  }, 1000);
}

function stopMonitor(){
  if (monitorUnsub) monitorUnsub();
  clearInterval(monitorTickTimer);
  if (map && marker) { map.removeLayer(marker); marker = null; }
}

const markerIcon = L.divIcon({
  html:'<div style="width:18px;height:18px;background:#bc1888;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(188,24,136,.4)"></div>',
  iconSize:[18,18]
});

function updateMonitor(d){
  const ll = [d.lat, d.lng];
  monitorLastTs = d.tsLocal || Date.now();
  if (!marker) marker = L.marker(ll, {icon:markerIcon}).addTo(map);
  else marker.setLatLng(ll);
  
  $("#m-lat").textContent = d.lat.toFixed(6);
  $("#m-lng").textContent = d.lng.toFixed(6);
  $("#m-acc").textContent = Math.round(d.accuracy||0)+" m";
  $("#m-gmaps").href = `https://www.google.com/maps?q=${d.lat},${d.lng}`;
  
  if ($("#m-follow").checked) map.panTo(ll, {animate:true});
}
</script>
</body>
</html>
